[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "supercloud-power"
version = "0.1.0"
description = "ETL and generative modeling for MIT SuperCloud Slurm + GPU telemetry → power_draw_W"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
etl = ["pandas>=2.0", "numpy>=1.24", "pyarrow>=14"]
train = ["torch>=2.1", "pyyaml>=6"]
dev = ["pytest>=7.4", "ruff>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
