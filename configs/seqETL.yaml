paths:
  slurm_features: "supercloud_power/data/i/slurm_log.parquet"
  gpu_traces:     "supercloud_power/data/i/gpu_traces.csv"
  npy_dir:        "supercloud_power/data/p/npy"
  train_chunks:   "supercloud_power/data/p/train_chunks.parquet"
  test_chunks:    "supercloud_power/data/p/test_chunks.parquet"
  norm_stats:     "supercloud_power/data/p/norm_stats.npz"
  report:         "supercloud_power/data/p/seq-etl-report.txt"

channels:
  - name: gpu_used_pct
    norm: linear_pct        
  - name: memory_used_pct
    norm: linear_pct          
  - name: memory_used_MiB
    norm: log1p_zscore        
  - name: power_draw_W
    norm: log1p_zscore      

sequence:
  W_ctx:  2048
  W_pred: 1024
  stride: 1024
  patch_size: 16

normalization:
  clip_range: [-10.0, 10.0]   
  min_std:    1.0e-6          
  stats_sample_frac: null

split:
  test_frac: 0.10
  seed:      42
  stratify_cols:
    - type_batch
    - type_interactive
    - type_map
    - type_other
    - nodes_req_is_one


slurm_feature_cols:
  # Temporal (4)
  - hour_sin
  - hour_cos
  - dow_sin
  - dow_cos
  # Continuous (7)
  - mem_unlimited
  - mem_req_scaled
  - nodes_req_is_one
  - nodes_req_log
  - cpus_req_scaled
  - duration_scaled
  - priority_scaled
  # Priority tier 1-hot (3)
  - ptier_0
  - ptier_1
  - ptier_2
  # Job type 1-hot (4)
  - type_batch
  - type_interactive
  - type_map
  - type_other
  # Job state 1-hot (6)
  - state_other
  - state_3
  - state_4
  - state_5
  - state_6
  - state_11



# ── Storage ──────────────────────────────────────────────────────────────────
storage:
  parquet_compression: zstd
  npy_skip_min_bytes:  64     # resume: skip existing NPYs at least this large

# ── Worker / parallelism ─────────────────────────────────────────────────────
workers:
  reserved_cpus: 2            # CPUs left idle (cpu_count - reserved_cpus)
  max_workers:   null         # null = auto-detect; integer overrides
  batch_size:    500          # jobs per ProcessPoolExecutor batch