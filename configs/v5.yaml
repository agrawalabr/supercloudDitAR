# Top-level v5 pipeline config — read by main.py
#
# Each stage (seqETL, train, inference) finds its config here.
# main.py runs them in order; pass --skip_* flags to selectively skip stages.

paths:
  # Stage configs
  seq_etl_config: "configs/seqETL.yaml"

  # Outputs from SeqETL (read by train + inference)
  train_chunks:   "data/p/train_chunks.parquet"
  train_jobs:     "data/p/train_jobs.parquet"
  test_chunks:    "data/p/test_chunks.parquet"
  test_jobs:      "data/p/test_jobs.parquet"
  norm_stats:     "data/p/norm_stats.npz"

  # Train + inference outputs
  ckpt_dir:       "output/v5/ckpt"
  inference_dir:  "data/inference/v5"

# ── Sequence dimensions (must match seqETL.yaml exactly) ────────────────────
sequence:
  W_ctx:  16384  # 16384 bins × 0.103 s ≈ 28 min of context
  W_pred: 8192   # 8192  bins × 0.103 s ≈ 14 min prediction window
  stride: 8192   # stride = W_pred → non-overlapping windows, no train/inference mismatch
  patch_size: 16

# ── Model architecture ──────────────────────────────────────────────────────
# N_tokens = 1 (cond) + W_ctx/P (1024) + W_pred/P (512) + W_pred/P (512) = 2049
# 1 H200 (141 GB), B=256, N=2049: activations ≈ 58 GB → ~66 GB total (47% of VRAM).
model:
  d_model: 384
  n_heads: 6
  n_layers: 12
  mlp_ratio: 4
  dropout: 0.1                   # raised from 0.0 — regularization for 40K-job dataset;
                                  # reduces overfitting when training for 80 epochs
  patch_size: 16
  W_ctx: 16384
  W_pred: 8192
  cond_dim: 24
  n_channels: 4
  n_aux_channels: 3
  diffusion_T: 1000
  # Gradient checkpointing: recomputes each DiT block during backward instead of
  # caching its activations. At B=256 the original design comment predicted
  # ~66 GB total (47% of 139 GB H200) without checkpointing — safe headroom.
  # Disabling gives ~2× faster backward (no recompute). Re-enable if OOM.
  use_checkpoint: false

# ── Training hyperparameters ────────────────────────────────────────────────
# Dataset: ~40K jobs (5 min – 2 hr), 124,629 train chunks (250K with stride=4096).
# Per-GPU steps: chunks ÷ 2 GPUs ÷ batch_size.
#   B=256, stride=8192 → 124,629÷2÷256 = 243 steps/epoch → 80 epochs = 19,440 total
#   B=256, stride=4096 → ~250K÷2÷256  = 488 steps/epoch → 50 epochs = 24,400 total (Phase 2)
train:
  batch_size: 256                 # reduced from 1024 → 4× more steps/epoch (60→243).
                                  # Critical: previous config had only 1,200 total steps
                                  # with warmup=1000, so 83% of training was warmup and
                                  # the model never reached full LR. Smaller batch also
                                  # gives noisier gradients that help escape flat regions
                                  # on a small 40K-job dataset.
  n_epochs: 160                    # increased from 20 → ~19,440 total steps.
                                  # Small dataset needs more passes; diffusion models
                                  # benefit from 100+ effective epochs over each example.
  lr: 1.5e-5                      # unchanged — previously stable at this value. Adam
                                  # is relatively robust to batch-size changes.
  weight_decay: 0.05              # increased from 0.01 — stronger L2 regularization
                                  # helps prevent overfitting on the smaller 40K-job set.
  warmup_steps: 500               # reduced from 1000. Was 83% of old total (1200 steps)!
                                  # Now ~2.6% of 19,440 — appropriate ramp-up budget.
  grad_clip: 1.0                  # unchanged — stable with lr=1.5e-5
  cfg_dropout_p: 0.05
  loss_skip_threshold: 20.0       # only masks true NaN/Inf outliers (~0.06% of samples)
  max_steps_per_epoch: null       # 124,629 chunks ÷ 2 GPUs ÷ 256 = 243 steps/epoch.
                                  # (Phase 2: ~250K chunks with stride=4096 → 488 steps/epoch)
  log_every: 100                  # every 100 steps (~every 0.4 epochs at B=256)
  ckpt_every_steps: 1000          # checkpoint every ~4 epochs
  ema_decay: 0.9999
  gpu_warmup_secs: 30
  num_workers: 4
  prefetch_factor: 8
  compile: false                  # torch.compile causes 5-20 min 0% GPU on first run
                                  # (kernel tracing) → idle-GPU node kill on Supercloud.

  # Scheduled-noise exposure-bias mitigation
  # Starts at epoch 32/80 (= frac 0.40) — after model has learned coarse structure.
  scheduled_sampling_start_frac: 0.40  # was 0.45 (epoch 9/20); keep same relative timing
  scheduled_sampling_p_max: 0.4        # raised from 0.3 — 40K-job dataset benefits from
                                        # stronger exposure-bias correction
  scheduled_sampling_t_min: 50
  scheduled_sampling_t_max: 200

# ── Inference ───────────────────────────────────────────────────────────────
inference:
  subsample_n: null               # null = use full test set
  plot_n_samples: 10
  subsample_stratify_cols: []
  max_windows_per_job: null        # 103 × 8192 bins × 0.103 s ≈ 24.2 h per job
                                  # covers 100% of <1hr jobs (≤5 windows) and 100%
                                  # of 1–24hr jobs; first 24hr generated for >24hr jobs
  ddim_steps: 50
  cfg_scale: 3.0                  # raised from 1.5 — low cfg_scale was suppressing the
                                  # conditional signal (SLURM features). 3.0 amplifies
                                  # guidance toward the predicted conditional distribution.
  save_per_job_traces: false      # set true to save (timestamp, real, gen) CSVs
  skip_existing_synth: true       # set true to skip jobs with existing synth .npy files
  seed: 42

# ── SLURM cond columns (must match seqETL.yaml exactly; 24 dims) ────────────
slurm_feature_cols:
  - hour_sin
  - hour_cos
  - dow_sin
  - dow_cos
  - mem_unlimited
  - mem_req_scaled
  - nodes_req_is_one
  - nodes_req_log
  - cpus_req_scaled
  - duration_scaled
  - priority_scaled
  - ptier_0
  - ptier_1
  - ptier_2
  - type_batch
  - type_interactive
  - type_map
  - type_other
  - state_other
  - state_3
  - state_4
  - state_5
  - state_6
  - state_11
